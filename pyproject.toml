[project]
name = "rgpoly"
version = "0.3.0"
description = "Fast local Polymarket wallet-copy trading engine"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "py-clob-client-v2>=1.0.1",
    "eth-account>=0.13.0",
]

[project.scripts]
rgpoly = "rgpoly.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
