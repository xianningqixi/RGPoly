[engine]
# Local SQLite runtime database. Runtime data is not committed.
db_path = ".runtime/rgpoly.sqlite"
# Poll interval in milliseconds. Smaller is faster and heavier on APIs.
poll_interval_ms = 750
activity_limit = 20
http_timeout_sec = 4.0

[execution]
# manual = monitor only; dry_run = simulated fills; live = real orders.
mode = "dry_run"
execute_limit_per_loop = 10
live_enabled_env = "RGPOLY_LIVE_ENABLED"
ack_value = "I_UNDERSTAND_REAL_MONEY_RISK"
max_daily_usdc = 50.0
max_open_intents = 25
tick_size = "0.01"
default_neg_risk = false
order_type = "FOK"

[[wallet_copy]]
# Each wallet_copy block is one copy-trading strategy.
name = "btc_directional_copy"
enabled = true
stake_usdc = 10.0
min_entry_price = 0.05
max_price = 0.90
max_source_to_ask_gap = 0.06
min_ask_depth_usdc = 10.0
min_source_usdc = 3.0
max_signal_age_sec = 180
required_title_keywords = ["bitcoin", "btc"]
blocked_title_keywords = []
allowed_outcomes = ["Yes", "No"]

[wallet_copy.wallets]
creamcream_btc_directional = "0x6e1d5040d0ac73709b0621f620d2a60b80d2d0fa"

